name: Android
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify public Cast receiver default
        run: |
          if grep -Eq '^[[:space:]]*castReceiverAppId[[:space:]]*=' gradle.properties; then
            echo 'Configure custom Cast receivers with a local build override.'
            exit 1
          fi
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: homestream-debug
          path: app/build/outputs/apk/debug/app-debug.apk
